; =====================================================================
; PlatformIO - NodeMCU v3 (ESP8266 + CH340)
; Mở thư mục gốc của dự án trong Antigravity IDE hoặc VS Code; thanh dưới cùng sẽ có nút
; Build (dấu ✓), Upload (mũi tên →) và Serial Monitor (biểu tượng phích cắm).
; =====================================================================
[platformio]
src_dir     = firmware/src
include_dir = firmware/include
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

monitor_speed = 115200
upload_speed  = 115200

; Mặc định PlatformIO tự dò cổng COM. Nếu bị nhầm cổng, bỏ dấu ; và điền đúng cổng:
upload_port  = COM6
monitor_port = COM6
monitor_rts  = 0
monitor_dtr  = 0

lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    bblanchon/ArduinoJson@^6.21.3
